{% extends "base.html" %}

{% block content %}
<div class="planner-header">
    <div class="header-actions">
        <input type="text" id="board-name" placeholder="Name des Boards..." value="Unbenanntes Team">
        <button onclick="saveCurrentBoard()">Speichern</button>
        <button class="clear-btn" onclick="clearBoard()">Board leeren</button>
    </div>
</div>

<div class="main-planner-area">
    <div class="synergy-sidebar">
        <h3 style="margin-top: 0;">Traits</h3>
        <div id="synergy-list"></div>
    </div>

    <div id="tft-board"></div>
</div>

<div class="bank-section">
    
    <div class="bank-tabs">
        <button id="tab-champions" class="bank-tab active" onclick="switchTab('champions')">Champions</button>
        <button id="tab-items" class="bank-tab" onclick="switchTab('items')">Items</button>
    </div>

    <div id="champion-container">
        <div class="filter-bar">
            <input type="text" id="search-input" placeholder="Suchen..." oninput="filterUnits()">
            <select id="trait-filter" onchange="filterUnits()"><option value="">Alle Traits</option></select>
            <select id="cost-filter" onchange="filterUnits()">
                <option value="">Alle Kosten</option>
                <option value="1">1 Gold</option>
                <option value="2">2 Gold</option>
                <option value="3">3 Gold</option>
                <option value="4">4 Gold</option>
                <option value="5">5 Gold</option>
            </select>
            <button class="secondary-btn" onclick="resetFilters()">Reset</button>
        </div>
        <div id="unit-bank"></div>
    </div>

    <div id="item-container" class="hidden">
        <div class="filter-bar">
            <input type="text" id="item-search-input" placeholder="Item suchen..." oninput="filterItems()" style="flex: 1;">
            
            <select id="item-category-filter" onchange="filterItems()">
                <option value="">Alle Items</option>
                <option value="Standard">Standard Items</option>
                <option value="Artifact">Artefakte</option>
                <option value="Emblem">Embleme</option>
            </select>
            
            <button class="secondary-btn" onclick="resetItemFilters()">Reset</button>
        </div>
        <div id="item-bank"></div>
    </div>

</div>
{% endblock %}
