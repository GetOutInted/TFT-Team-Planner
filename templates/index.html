<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TFT Planner Set 16 </title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/tft_logo.png') }}">
</head>
<body>
    <div id="auth-section">
    <form class="auth-form" id="login-form">
        <h1>TFT Team Planner</h1>
        <input type="text" id="username" placeholder="Nutzername" required>
        <input type="password" id="password" placeholder="Passwort" required>
        <div class="auth-buttons">
            <button type="submit">Login</button>
            <button type="button" onclick="handleAuth('register')">Registrieren</button>
        </div>
    </form>
</div>

    <div id="planner-section" style="display:none;">
        <header>
            <h2>Strategie von <span id="user-display"></span></h2>
            <button onclick="logout()">Abmelden</button>
        </header>

        <div id="tft-board" class="board"></div>

        <div class="unit-bank-container">
            <h3>Champion Auswahl</h3>
            

            <div class="filter-bar">
    <input type="text" id="search-input" placeholder="Champion suchen..." oninput="filterUnits()">
    
    <select id="trait-filter" onchange="filterUnits()">
        <option value="">Alle Traits</option>
        </select>

    <select id="cost-filter" onchange="filterUnits()">
        <option value="">Alle Kosten</option>
        <option value="1">1 Cost</option>
        <option value="2">2 Cost</option>
        <option value="3">3 Cost</option>
        <option value="4">4 Cost</option>
        <option value="5">5 Cost</option>
    </select>
</div>


            <div id="unit-bank" class="unit-bank"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
