<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TFT Planner</title>
    
    <link rel="icon" href="{{ url_for('static', filename='img/tft_logo.png') }}" type="image/png">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    {% if user and user.design == 'lol' %}
        <link rel="stylesheet" href="{{ url_for('static', filename='css/lol-style.css') }}">
    {% endif %}
</head>
<body class="{% if user and user.theme == 'light' %}light-mode{% endif %}">

    <nav class="main-nav">
        <div class="nav-container">
            <div class="logo" id="logo-easter-egg" style="cursor: pointer;">TFT Planner</div>
            <div class="nav-links">
                {% if user %}
                    <span style="margin-right: 15px; font-size: 0.95rem; opacity: 0.9;">
                        <strong style="color: var(--accent-color);">{{ user.username }}</strong>
                    </span>
                    
                    <a href="{{ url_for('planner') }}">Planner</a>
                    <a href="{{ url_for('profile') }}">Profil</a>
                    <a href="{{ url_for('logout') }}" class="logout-link">Logout</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="content-wrapper">
        {% block content %}{% endblock %}
    </div>

    <div id="toast-container"></div>
    
    <div id="confirmation-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <h3>Bestätigung</h3>
            <p>Bist du sicher?</p>
            <div class="modal-actions">
                <button class="secondary-btn" id="modal-cancel-btn">Abbrechen</button>
                <button class="danger-btn" id="modal-confirm-btn">Löschen</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
