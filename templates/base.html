<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>TFT Planner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/tft_logo.png') }}">
    <script>
        const currentTheme = "{{ user.theme if user else 'dark' }}";
        document.addEventListener('DOMContentLoaded', () => {
            document.body.className = currentTheme + "-mode";
        });
    </script>
</head>
<body class="dark-mode"> <nav class="main-nav">
        <div class="nav-container">
            <span class="logo">TFT Team Planner</span>
            {% if session['user_id'] %}
            <div class="nav-links">
                <a href="{{ url_for('planner') }}">Planner</a>
                <a href="{{ url_for('profile') }}">Profil</a>
                <a href="{{ url_for('logout') }}" class="logout-link">Abmelden</a>
            </div>
            {% endif %}
        </div>
    </nav>

    <main class="content-wrapper">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
